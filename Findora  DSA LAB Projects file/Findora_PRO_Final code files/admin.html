<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Findora — Operations Dashboard</title><style>
:root{--bg:#07111f;--p:#0d1a2b;--p2:#101f33;--line:#20364f;--t:#eff7ff;--m:#8fa5bb;--a:#43d6b5;--b:#6d8dff;--d:#ff7180;--w:#f2c064}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#142a47,#07111f 45%,#050a12);color:var(--t);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:28px;font-weight:900}.brand span{color:var(--a)}.sub{color:var(--m)}.btn{border:1px solid var(--line);background:#112337;color:white;border-radius:10px;padding:10px 14px;font-weight:750}.btn.ok{background:#10362f;border-color:#1d6a5a;color:#73e4c8}.btn.bad{background:#351922;border-color:#642631;color:#ff9ba7}.btn.blue{background:#172a54;border-color:#2d4e93}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:linear-gradient(145deg,#0e1c2d,#091523);border:1px solid var(--line);border-radius:18px;padding:18px}.metric small{color:var(--m)}.metric b{display:block;font-size:29px;margin-top:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{background:#081421;border:1px solid #21364f;color:white;border-radius:10px;padding:10px}.claim{display:grid;grid-template-columns:1fr auto;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.claim:last-child{border:0}.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#332914;color:#f5c76c;font-size:11px;font-weight:900}.tag.green{background:#10352f;color:#6fe2c7}.tag.red{background:#351922;color:#ff9aa7}.actions{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#020813dd;display:none;place-items:center}.modal.show{display:grid}.box{width:min(600px,92vw);background:#0d1b2c;border:1px solid #29445f;border-radius:18px;padding:22px}.close{float:right;background:none;border:0;color:#9bb0c5;font-size:24px}.answer{padding:10px 12px;background:#081421;border:1px solid #20364f;border-radius:10px;margin:8px 0;color:#d8e7f4}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.claim{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">find<span>ora</span> <small style="font-size:11px;color:#7890a7">OPS</small></div><div class="sub">Verification, claims and successful returns control center.</div></div><div><button class="btn" onclick="location.href='/dashboard.html'">User Dashboard</button> <button class="btn" onclick="location.href='/history.html'">Public History</button> <button class="btn bad" onclick="logout()">Sign out</button></div></header><div class="grid"><div class="card metric"><small>Total reports</small><b id="reports">0</b></div><div class="card metric"><small>Pending claims</small><b id="claims">0</b></div><div class="card metric"><small>Verified</small><b id="verified">0</b></div><div class="card metric"><small>Returned</small><b id="returned">0</b></div></div><div class="card"><div class="toolbar"><input id="filter" placeholder="Search item, location or claimant" oninput="render()"><select id="status" onchange="render()"><option value="">All statuses</option><option value="claimed">Claimed</option><option value="verified">Verified</option><option value="returned">Returned</option><option value="active">Active</option></select><button class="btn blue" onclick="load()">Refresh</button></div><div id="list"></div></div></div><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeM()">×</button><h2 id="mtitle">Claim review</h2><div id="mbody"></div></div></div><script>
const token=localStorage.getItem('findoraToken');let data=[];const $=x=>document.getElementById(x);if(!token)location.href='/';
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(path,opt),d=await r.json();if(r.status===401||r.status===403){alert(d.error||'Access denied');location.href='/';throw Error('Access denied')}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{let d=await api('/api/admin/claims');data=d.items;let s=await api('/api/stats');$('reports').textContent=s.reported;$('claims').textContent=s.pendingClaims;$('verified').textContent=s.verified;$('returned').textContent=s.returned;render()}catch(e){alert(e.message)}}
function render(){let q=$('filter').value.toLowerCase(),st=$('status').value;let a=data.filter(i=>(!st||i.status===st)&&(!q||JSON.stringify(i).toLowerCase().includes(q)));$('list').innerHTML=a.length?a.map(i=>`<div class="claim"><div><div style="font-size:18px;font-weight:850">${esc(i.itemName)} ${tag(i.status)}</div><div class="sub">${esc(i.category)} · ${esc(i.location)} · reported ${esc(i.dateReported)} · finder ${esc(i.finderEmail||'—')}</div>${i.claimantEmail?`<div class="answer"><b>Claimant:</b> ${esc(i.claimantEmail)}<br><b>Answer 1:</b> ${esc(i.answer1||'—')}<br><b>Answer 2:</b> ${esc(i.answer2||'—')}</div>`:''}</div><div class="actions">${i.status==='claimed'?`<button class="btn ok" onclick="act(${i.id},'verify')">Verify</button><button class="btn bad" onclick="act(${i.id},'reject')">Reject</button>`:''}${i.status==='verified'?`<button class="btn ok" onclick="act(${i.id},'returned')">Mark Returned</button>`:''}<button class="btn" onclick="details(${i.id})">Details</button></div></div>`).join(''):'<div class="sub" style="padding:30px;text-align:center">No records match your filters.</div>'}
function tag(s){return `<span class="tag ${s==='verified'||s==='returned'?'green':s==='active'?'red':''}">${s.toUpperCase()}</span>`}
async function act(id,a){try{await api('/api/items/'+id+'/'+a,{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}function details(id){let i=data.find(x=>x.id===id);$('mtitle').textContent=i.itemName;$('mbody').innerHTML=`<p class="sub">Full report</p><p><b>Category:</b> ${esc(i.category)}</p><p><b>Color:</b> ${esc(i.color||'—')}</p><p><b>Location:</b> ${esc(i.location)}</p><p><b>Date:</b> ${esc(i.dateReported)} ${esc(i.timeFound||'')}</p><p><b>Description:</b> ${esc(i.description||'—')}</p><p><b>Finder:</b> ${esc(i.finderName||i.finderEmail||'—')}</p><p><b>Contact:</b> ${i.status==='verified'||i.status==='returned'?esc(i.finderContact||'—'):'Hidden until verification'}</p>`;$('modal').classList.add('show')}function closeM(){$('modal').classList.remove('show')}function logout(){fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}}).finally(()=>{localStorage.clear();location.href='/'})}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
